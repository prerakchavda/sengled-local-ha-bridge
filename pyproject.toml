[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sengled-local-ha-bridge"
version = "1.0.0"
description = "100% local, cloud-free Home Assistant bridge for Sengled Wi-Fi and Bluetooth (BLE) smart bulbs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "paho-mqtt>=1.6.1,<3.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
ble = [
    "bleak>=0.21.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
sengled-bridge = "sengled_bridge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
