# Mosquitto Configuration for Sengled Local Home Assistant Bridge
#
# Listener 1883: Plaintext internal/LAN listener for Home Assistant & Bridge daemon
# Listener 8883: Mandatory TLS listener for Sengled Wi-Fi bulbs (WF861/WF862/WF863/WF864/WF866/WF867/SLMB01)
#
# IMPORTANT: Do NOT set `password_file` on the bulb-facing listener. Some Sengled firmware
# versions send `?SDK=C&Version=3.0.1` as the MQTT username while others connect anonymously.
# Pattern-based ACL rules in acl.conf allow all firmware generations to connect cleanly.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

allow_anonymous true
acl_file /mosquitto/config/acl.conf

# Internal / Home Assistant listener
listener 1883 0.0.0.0
protocol mqtt

# Sengled Wi-Fi Bulb TLS listener
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2
