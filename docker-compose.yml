version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sengled-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - ./certs:/mosquitto/certs:ro
      - ./data/mosquitto:/mosquitto/data
    depends_on:
      sengled-bridge:
        condition: service_started

  sengled-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sengled-local-ha-bridge
    restart: unless-stopped
    environment:
      - ADVERTISE_IP=${ADVERTISE_IP:-192.168.1.100}
      - HTTP_PORT=${HTTP_PORT:-8080}
      - BULB_TLS_PORT=${BULB_TLS_PORT:-8883}
      - MQTT_HOST=${MQTT_HOST:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "9080:9080/udp"
    volumes:
      - ./certs:/data/certs
      - ./data/bridge:/data/state
