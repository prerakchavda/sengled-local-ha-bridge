# ESPHome Direct Firmware Configuration for Sengled WF863 (ESP8266) Bulbs
#
# Compatible Models (FCC ID: 2AGN8-WF863 / IC: 20888-WF863):
#   - W31-N11 (Soft White 2700K Dimmable)
#   - W31-N15 (Multicolor RGBW / Daylight)
#   - W31-N13H (Extra Bright 1500lm Multicolor RGBW)
#
# PWM Pinout (WF863 ESP8266EX 2MB Flash):
#   - GPIO4  : Red PWM
#   - GPIO12 : Green PWM
#   - GPIO14 : Blue PWM
#   - GPIO13 : Warm White PWM
#   - GPIO5  : Cool White PWM (on CCT / RGBWW variants)

esphome:
  name: sengled-wf863-bulb
  friendly_name: Sengled W31 Wi-Fi Bulb

esp8266:
  board: esp01_1m
  restore_from_flash: true

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

output:
  - platform: esp8266_pwm
    id: pwm_red
    pin: GPIO4
    frequency: 1000 Hz
  - platform: esp8266_pwm
    id: pwm_green
    pin: GPIO12
    frequency: 1000 Hz
  - platform: esp8266_pwm
    id: pwm_blue
    pin: GPIO14
    frequency: 1000 Hz
  - platform: esp8266_pwm
    id: pwm_warm_white
    pin: GPIO13
    frequency: 1000 Hz

light:
  - platform: rgbw
    name: "Sengled WF863 Light"
    red: pwm_red
    green: pwm_green
    blue: pwm_blue
    white: pwm_warm_white
    color_interlock: true
    restore_mode: ALWAYS_ON
