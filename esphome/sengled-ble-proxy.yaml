# ESPHome Bluetooth Proxy Configuration for Sengled BLE Bulbs (B11/B12/B1F/B21)
#
# Flash this onto any ESP32 board (e.g., ESP32-WROOM-32, M5Stack Atom Lite, Olimex ESP32-PoE)
# to give Home Assistant active GATT connections (up to 3 simultaneous connections)
# for Sengled Bluetooth SIG Mesh (0x1827 / 0x1828) and GATT bulbs.

esphome:
  name: sengled-ble-proxy
  friendly_name: Sengled BLE Mesh Proxy

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 300ms

bluetooth_proxy:
  active: true
  connection_slots: 3
