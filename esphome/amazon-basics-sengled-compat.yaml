# ESPHome Firmware for Amazon Basics "Works with Alexa Only" (ACK) Bulbs
# Emulating Native Sengled `wifielement/{MAC}/status` & `wifielement/{MAC}/update` MQTT Protocol
#
# When flashed onto an Amazon Basics `13aSB-A800ST-Q1T` / `13aSB-A806ST-Q1R` (`ESP32-PICO-V3-ZERO`),
# the bulb publishes `wifielement/{MAC}/status` and subscribes to `wifielement/{MAC}/update` on your
# `sengled-local-ha-bridge` MQTT broker, behaving identically to a native Sengled Wi-Fi bulb!

substitutions:
  bulb_mac: "F0:F0:A4:11:22:33"
  model_code: "13ASB-A800ST-Q1T"

esphome:
  name: amazon-basics-sengled-shim
  friendly_name: Amazon Basics Sengled Protocol Bulb
  on_boot:
    priority: -100
    then:
      - mqtt.publish:
          topic: "wifielement/${bulb_mac}/status"
          payload: >-
            [{"dn":"${bulb_mac}","type":"switch","value":"1"},{"dn":"${bulb_mac}","type":"brightness","value":"100"},{"dn":"${bulb_mac}","type":"typeCode","value":"${model_code}"},{"dn":"${bulb_mac}","type":"identifyNO","value":"ESP32-PICO-V3-ZERO"},{"dn":"${bulb_mac}","type":"supportAttributes","value":"switch,brightness,colorTemperature,color"},{"dn":"${bulb_mac}","type":"version","value":"V1.0.0-ACK-SHIM"}]

esp32:
  board: esp32-pico-d4
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: !secret sengled_bridge_ip
  port: 1883
  discovery: false
  on_json_message:
    - topic: "wifielement/${bulb_mac}/update"
      then:
        - lambda: |-
            if (!x.is<JsonArray>()) return;
            auto call = id(amazon_bulb_light).turn_on();
            bool turn_off = false;
            for (JsonObject item : x.as<JsonArray>()) {
              std::string t = item["type"] | "";
              std::string v = item["value"] | "";
              if (t == "switch") {
                if (v == "0") turn_off = true;
              } else if (t == "brightness") {
                float pct = atof(v.c_str()) / 100.0f;
                call.set_brightness(pct);
              } else if (t == "colorTemperature") {
                float pct = atof(v.c_str()) / 100.0f;
                float kelvin = 2200.0f + pct * (7000.0f - 2200.0f);
                call.set_color_temperature(1000000.0f / kelvin);
              } else if (t == "color") {
                int r = 255, g = 255, b = 255;
                if (sscanf(v.c_str(), "%d:%d:%d", &r, &g, &b) == 3) {
                  call.set_rgb(r / 255.0f, g / 255.0f, b / 255.0f);
                }
              }
            }
            if (turn_off) {
              id(amazon_bulb_light).turn_off().perform();
            } else {
              call.perform();
            }

output:
  - platform: ledc
    id: out_red
    pin: GPIO4
    frequency: 1000 Hz
  - platform: ledc
    id: out_green
    pin: GPIO5
    frequency: 1000 Hz
  - platform: ledc
    id: out_blue
    pin: GPIO18
    frequency: 1000 Hz
  - platform: ledc
    id: out_warm_white
    pin: GPIO19
    frequency: 1000 Hz
  - platform: ledc
    id: out_cool_white
    pin: GPIO21
    frequency: 1000 Hz

light:
  - platform: rgbww
    id: amazon_bulb_light
    name: "Amazon Basics Sengled Compat Bulb"
    red: out_red
    green: out_green
    blue: out_blue
    warm_white: out_warm_white
    cool_white: out_cool_white
    warm_white_color_temperature: 2200 K
    cool_white_color_temperature: 7000 K
    color_interlock: true
    restore_mode: ALWAYS_ON
